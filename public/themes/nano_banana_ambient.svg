<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="100%" height="100%">
  <defs>
    <!-- Dark Obsidian Canvas Gradient -->
    <radialGradient id="nb-bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#1A1204" />
      <stop offset="45%" stop-color="#0E0A03" />
      <stop offset="100%" stop-color="#050402" />
    </radialGradient>

    <!-- Amber Glow Silk Waves -->
    <linearGradient id="nb-gold-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#D97706" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#78350F" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="nb-gold-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#B45309" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#451A03" stop-opacity="0" />
    </linearGradient>

    <!-- Neon Banana Wireframe Stroke Gradient -->
    <linearGradient id="nb-stroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.2" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="nb-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="80" />
    </filter>
    <filter id="nb-blur-sm" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1440" height="900" fill="url(#nb-bg)" />

  <!-- Ambient Gold Glowing Orbs -->
  <circle cx="280" cy="220" r="260" fill="#F59E0B" opacity="0.16" filter="url(#nb-blur)" />
  <circle cx="1180" cy="680" r="320" fill="#D97706" opacity="0.14" filter="url(#nb-blur)" />
  <circle cx="720" cy="450" r="200" fill="#FBBF24" opacity="0.1" filter="url(#nb-blur)" />

  <!-- Silk Ribbon Waves -->
  <path d="M-100,500 C300,320 600,680 1100,420 C1350,300 1500,480 1600,520 L1600,950 L-100,950 Z"
        fill="url(#nb-gold-1)" />

  <path d="M-100,300 C400,550 850,220 1200,480 C1400,620 1550,580 1600,600 L1600,950 L-100,950 Z"
        fill="url(#nb-gold-2)" />

  <!-- Nano Banana Geometric Contour Vector Art (Organic Floating Arc) -->
  <g transform="translate(180, 140) rotate(-18)" opacity="0.22">
    <!-- Banana Silhouette Arc 1 -->
    <path d="M50,180 C80,80 220,30 380,80 C480,120 540,200 560,260 C520,220 440,160 340,140 C220,120 120,160 50,180 Z"
          fill="none" stroke="url(#nb-stroke)" stroke-width="2.5" />
    <path d="M80,170 C140,110 240,80 360,110 C440,130 500,180 520,220"
          fill="none" stroke="#FDE047" stroke-width="1.2" stroke-dasharray="6,8" opacity="0.6" />
  </g>

  <g transform="translate(860, 480) rotate(22)" opacity="0.18">
    <!-- Banana Silhouette Arc 2 -->
    <path d="M40,160 C70,70 190,30 340,70 C430,105 480,170 500,230 C460,190 390,140 300,120 C190,100 100,140 40,160 Z"
          fill="none" stroke="url(#nb-stroke)" stroke-width="2" />
  </g>

  <!-- Ambient Dust / Gold Micro Stars -->
  <g opacity="0.45">
    <circle cx="210" cy="180" r="1.5" fill="#FDE047" />
    <circle cx="340" cy="290" r="1.8" fill="#FBBF24" />
    <circle cx="510" cy="140" r="1.2" fill="#F59E0B" />
    <circle cx="680" cy="270" r="2.0" fill="#FDE047" />
    <circle cx="890" cy="190" r="1.5" fill="#FBBF24" />
    <circle cx="1040" cy="320" r="1.6" fill="#FDE047" />
    <circle cx="1220" cy="210" r="1.8" fill="#FBBF24" />
    <circle cx="150" cy="620" r="1.4" fill="#F59E0B" />
    <circle cx="430" cy="710" r="2.2" fill="#FDE047" />
    <circle cx="760" cy="640" r="1.5" fill="#FBBF24" />
    <circle cx="980" cy="740" r="1.8" fill="#FDE047" />
    <circle cx="1290" cy="610" r="1.2" fill="#F59E0B" />
  </g>
</svg>
